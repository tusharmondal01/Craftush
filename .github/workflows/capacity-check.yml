name: Controlled 5000-request capacity check

on:
  push:
    branches: [fix/v17-cloudflare-backend]
    paths: [scripts/check-capacity.mjs, .github/workflows/capacity-check.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: craftush-capacity-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Check public pages and backend health with bounded traffic
        run: node scripts/check-capacity.mjs
