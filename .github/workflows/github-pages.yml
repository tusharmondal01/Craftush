name: Publish Craftush v17 to GitHub Pages

on:
  push:
    branches: [main]
    paths: [.github/workflows/github-pages.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: craftush-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: 12d41481e8a1d4cb598535fefc3c464cfefac6d9
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: node scripts/verify-cloudflare-backend.mjs
        env:
          PAGES_API_BASE: ${{ vars.PAGES_API_BASE || 'https://craftush.tushar-mondal.workers.dev' }}
      - run: node scripts/build-github-pages.mjs
        env:
          PAGES_BASE_PATH: /Craftush
          PAGES_API_BASE: ${{ vars.PAGES_API_BASE || 'https://craftush.tushar-mondal.workers.dev' }}
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

